<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
    <title>Sana Nadeem!!! :)</title>

    <!-- Combined Font Imports into a Single Request -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top, #2b0000, #000000);            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            height: 100vh;
            position: relative;
            color: white;
            padding: 40px;              
            box-sizing: border-box;
        }

        /* Glowing Animated Background Overlays */
        body::before {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            background: rgba(128, 0, 0, 0.25);
            filter: blur(130px);
            top: -120px;
            left: -120px;
            animation: glowMove 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            width: 550px;
            height: 550px;
            background: rgba(80, 0, 0, 0.18);
            filter: blur(150px);
            bottom: -180px;
            right: -180px;
            animation: glowMove2 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes glowMove {
            from { transform: translate(0,0); }
            to { transform: translate(90px, 70px); }
        }

        @keyframes glowMove2 {
            from { transform: translate(0,0); }
            to { transform: translate(-90px, -70px); }
        }

        /* Background Canvas Particles */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* TITLE - Elegant Style */
        .title {
            margin: 20px 0 30px 0;
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: 38px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #800000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(128, 0, 0, 0.6);
            z-index: 10;
            animation: breathingTitle 4s infinite ease-in-out;
        }

        /* Cards Grid Workspace */
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
            height: calc(100vh - 140px);
            overflow-y: auto;
            padding: 20px;
            position: relative; 
            z-index: 5; 
            justify-content: center;
            margin: 0px auto;
            scroll-behavior: smooth;
        }

        .cards::-webkit-scrollbar {
            width: 4px;
        }

        .cards::-webkit-scrollbar-thumb {
            background: #800000;
            border-radius: 10px;
        }

        .envelope {
            position: relative;
            width: 220px;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #2a0000, #000000);
            border-radius: 0 0 20px 20px;
            cursor: pointer;
            color: white;
            text-align: center;
            font-size: 28px;
            box-shadow: 0 0 25px rgba(128, 0, 0, 0.25);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            z-index: 1;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            animation: popIn 0.6s ease forwards;
        }

        .envelope:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 45px rgba(128, 0, 0, 0.55);
        }

        /* Envelope fold design elements */
        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #800000;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top;
        }

        .envelope.open::before {
            transform: rotateX(180deg);
        }

        .envelope::after {
            content: "";
            position: absolute;
            inset: 0;
            background: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            opacity: 0.15;
            pointer-events: none;
            border-radius: 0 0 20px 20px;
        }

        /* Full-screen Overlay Message Architecture */
        .message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .message-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .message-box {
            width: 85%;
            max-width: 600px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 45px 30px 35px 30px;
            background: rgba(11, 18, 32, 0.98);
            color: #ffffff;
            border: 1px solid rgba(128, 0, 0, 0.6);
            border-radius: 20px;
            transform: scale(0.7) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 16px;
            line-height: 1.8;
            text-align: left;
            position: relative;
            box-shadow: 0 30px 70px rgba(0,0,0,0.9), 0 0 40px rgba(0, 194, 255, 0.35);
        }

        .message-overlay.active .message-box {
            transform: scale(1) translateY(0);
        }

        .message-box::-webkit-scrollbar {
            width: 5px;
        }
        .message-box::-webkit-scrollbar-thumb {
            background: #800000;
            border-radius: 10px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(250, 50, 50, 0.15);
            border: 1px solid rgba(250, 50, 50, 0.4);
            color: white;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(250, 50, 50, 0.8);
            transform: scale(1.05);
        }

        /* Side-Docked Auto-Flipbooks */
        .book-wrapper {
            position: absolute;
            width: 140px;
            height: 240px;
            z-index: 1;
            pointer-events: none;
        }

        .book-wrapper.left { bottom: 15px; left: 15px; }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 2000px;
        }

        .page {
        position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            border-radius: 14px;
            transition: transform 1s ease, opacity 1s ease;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(128, 0, 0, 0.25);
}

        .page.active {
            transform: rotateY(0deg);
            opacity: 1;
            z-index: 10;
        }

        .page.prev {
            transform: rotateY(-10deg) translateX(-10px);
            opacity: 0.45;
        }

        .page.next {
            transform: rotateY(-180deg);
            opacity: 0;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100000;
            padding: 11px 18px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: linear-gradient(45deg, #800000, #000000);
            box-shadow: 0 0 20px rgba(128, 0, 0, 0.4);
            transition: 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 35px rgba(128, 0, 0, 0.8);
        }

        .mute-btn {
            position: fixed;
            top: 20px;
            left: 125px;
            z-index: 100000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(11, 18, 32, 0.8);
            border: 1px solid rgba(128, 0, 0, 0.4);
            color: #800000;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(128, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .mute-btn:hover {
            background: rgba(128, 0, 0, 0.25);
            box-shadow: 0 0 25px rgba(128, 0, 0, 0.8);
            transform: scale(1.08);
    }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Sequential Envelope Entrance Cascades */
        .envelope:nth-child(1) { animation-delay: 0.05s; }
        .envelope:nth-child(2) { animation-delay: 0.10s; }
        .envelope:nth-child(3) { animation-delay: 0.15s; }
        .envelope:nth-child(4) { animation-delay: 0.20s; }
        .envelope:nth-child(5) { animation-delay: 0.25s; }
        .envelope:nth-child(6) { animation-delay: 0.30s; }
        .envelope:nth-child(7) { animation-delay: 0.35s; }
        .envelope:nth-child(8) { animation-delay: 0.40s; }
        .envelope:nth-child(9) { animation-delay: 0.45s; }
        .envelope:nth-child(10) { animation-delay: 0.50s; }
        .envelope:nth-child(11) { animation-delay: 0.55s; }
        .envelope:nth-child(12) { animation-delay: 0.60s; }
        .envelope:nth-child(13) { animation-delay: 0.65s; }
        .envelope:nth-child(14) { animation-delay: 0.70s; }
        .envelope:nth-child(15) { animation-delay: 0.75s; }
        .envelope:nth-child(16) { animation-delay: 0.80s; }
        .envelope:nth-child(17) { animation-delay: 0.85s; }
        .envelope:nth-child(18) { animation-delay: 0.90s; }
        .envelope:nth-child(19) { animation-delay: 0.95s; }
        .envelope:nth-child(20) { animation-delay: 1.00s; }

        /* ================================================================== */
        /* MOBILE OPTIMIZATIONS (Cleaned and Merged Media Queries)            */
        /* ================================================================== */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .title {
                font-size: 26px;
            }

            .envelope {
                width: 160px;
                font-size: 22px;
            }

            .message-box {
                width: 90%;
                padding: 40px 20px 20px 20px;
                font-size: 14px;
            }

            .book-wrapper {
                bottom: 90px;
                right: 10px;
            }

            .book {
                width: 110px;
                height: 180px;
            }

            .next-btn {
                font-size: 14px;
                padding: 10px 16px;
            }

            .back-btn {
                top: 15px;
                left: 15px;
                font-size: 13px;
                padding: 9px 14px;
            }

            .mute-btn {
                top: 15px;
                left: 105px; 
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            /* Prevent sticky pointer scale hanging around on touch drag */
            .envelope:hover, .next-btn:hover, .back-btn:hover, .close-btn:hover, .mute-btn:hover {
                transform: none !important;
            }

            #bgCanvas {
                pointer-events: none !important;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 22px;
            }

            .envelope {
                width: 140px;
            }

            .book {
                width: 90px;
                height: 150px;
            }

            .book-wrapper {
                bottom: 80px;
                right: 5px;
            }
        }
        @keyframes breathingTitle {
    0%, 100% { text-shadow: 0 0 25px rgba(128, 0, 0, 0.6); transform: scale(1); }
    50% { text-shadow: 0 0 40px rgba(255, 100, 100, 0.8); transform: scale(1.02); }
}

    </style>
</head>

<script>
const messages = [
    
    "1. I honestly don’t know from where I should start this message because there are so many things in my heart that I wanted to say for a long time. Maybe this is the first and last time I am writing something this openly. Maybe after today life will become busy, paths will change, priorities will change and conversations will slowly fade away the way they usually do. But before that happens, I just wanted you to know how much these past 4 months actually meant to me.",
    "2. Sometimes I think it is strange how Allah Pak connects people. Some people stay around us for years and still never become close to our hearts, while some people enter our lives quietly and within a few days become impossible to forget. I think our bond was exactly like that.",
    "3. To be honest, I don’t even remember everything exactly about the first day we met. But as far as I remember it started because of a discipline-related matter. Someone informed me that the bus proctors were not properly following the rules so I decided to talk to all of you. At that time, I thought it would just be another normal conversation that I would eventually forget like many others. I had no idea that this one interaction would become the beginning of such a beautiful connection.",
    "4. I still remember the first impression you left on me. The way you talked respectfully, the way you calmly explained your side and the way you handled the situation without unnecessary arguments genuinely impressed me. Usually, during such discussions, people either become defensive or rude but you remained composed. I noticed that immediately. And honestly, first impressions matter to me a lot.",
    "5. Then came the Milad function days. Most of the bus proctors were assigned duty outside the hall. The weather was extremely hot that day and honestly almost everyone had some kind of complaint. But you never once complained about standing outside. Whatever duty I assigned you, you accepted it quietly and responsibly. You never argued, never tried to avoid work and never made excuses. Maybe for others it was a small thing but I notice these details deeply. Small actions tell a lot about a person’s character. At that moment I realized that you were much more mature than most people around you. And maybe that was one of the first moments when I unknowingly started respecting you more.",
    "6. After the function, technically our interaction should have ended there. We should have just remained “senior and junior” who once worked together during an event. But perhaps Allah had other plans. After the event there was that argument involving You, Anmol and some others. I still remember that situation clearly. Even though you were not feeling well at that time but you still listened to what I said. You looked upset, tired and honestly a little childish too. But somehow that moment stayed in my memory. I still remember looking at you and thinking, “This girl looks so innocent when she is upset.” I don’t know why that small memory stayed with me for so long but it did.",
    "7. After that, something slowly started changing between us. You started sharing things with me. At first small things. Then random things. Then almost everything. And honestly… I liked that feeling more than I ever admitted. I used to think: “It has only been a month since we met, yet this girl trusts me so much.”",
    "8. That trust genuinely touched my heart. Nowadays people think a hundred times before trusting someone but you trusted me so naturally and so purely. Even for small matters you used to inform me. Sometimes I even used to smile thinking about it. Not because it was funny. But because it felt special. Because in a strange way your trust made me feel important.",
    "9. There is something about your personality that always gave me peace. The way you think positively, the way you react gently, the way you try to avoid negativity… all these things made your presence comforting.",
    "10. And honestly, one thing I always noticed was your voice. No matter how many times we talked, your tone always remained soft, balanced and calm. Even when you were upset, your voice still carried gentleness in it.",
    "11. Maybe you never realized this, but some people leave impact through their words, while others leave impact through the feeling their presence gives. You were the second type. Whenever I talked to you, I felt peaceful.",
    "12. Then came the election days. Honestly, those days were mentally exhausting for me. I was nervous almost all the time. Outside I used to smile normally but internally there was constant pressure, overthinking, fear, expectations and confusion. But strangely, whenever I talked to you all, especially you, I used to feel lighter.",
    "13. I still remember saying that if I ever became the sash holder, I would give credit to the bus proctors because your support genuinely motivated me. And among that support, yours always felt different.",
    "14. Sincere support is rare. And you supported me sincerely. Not because you wanted anything in return. Not because you had some benefit. But purely because you wanted me to succeed. That kind of support becomes unforgettable. JazakAllah for that.",
    "15. I still remember the moment when the election results were about to be announced. You were standing beside me. Everyone around me probably thought I was okay because I was smiling and laughing normally. But inside, I cannot explain the storm I was carrying. My heart was racing so fast. I was trying my best not to break down emotionally. And I don’t know why… But your presence at that exact moment meant a lot to me. Just knowing you were standing there somehow made me feel stronger. Some people calm us without even speaking You were one of those people for me.",
    "16. I guess you still remember when I said: “Sana, don’t get attached to me.” And you replied: “You said it too late.” Honestly… I laughed at that moment but somewhere deep inside those words stayed with me. Because the truth is I already enjoyed your company before that conversation happened. But after that moment I started appreciating your presence even more.",
    "17. I just never showed it openly. Maybe because I was scared. Maybe because I didn’t want things to become emotionally complicated. Or maybe because I knew one day college would end and distances would come naturally. But regardless of all that… your company genuinely became important to me.",
    "18. I also remember that short phase when we were not in touch properly. On the first day, I ignored the feeling. On the second day, I kept checking my phone again and again without reason. And when your reply finally came, I genuinely couldn’t stop smiling. It sounds small but feelings are strange sometimes. Certain people quietly become part of our daily routine without us even realizing it. And when their presence suddenly disappears, everything feels slightly incomplete. That was exactly how it felt.",
    "19. There’s another thing I never told you properly. During the election discussions, when I found out that Anshara Baji and I might stand for the same post, I became really confused about what I should do. From your conversations I could clearly feel how much importance you gave to her. That is why I delayed writing my post on the form till the very last day. I kept overthinking everything. Only later, when I found out someone’s form would be withdrawn according to the members selection rule, I finally wrote my post. Maybe you never realized it but your opinions genuinely affected my decisions more than you think.",
    "20. I don’t even use Instagram that much, but one day I saw a request with your name. I wasn’t even fully sure whether it was your real account or not but without thinking twice I accepted it. And honestly… your highlights were genuinely enjoyable. I watched them many times.",
    "21. Sometimes when I wanted to select songs, I even used your highlights for choosing them. Your fashion sense, editing skills, humor and overall vibe were honestly amazing. You have removed those highlights now but strangely I still remember them. Funny how tiny things stay in memory.",
    "22. And then there was that candy incident. I casually gave you a candy once and after a few days you told me that you still kept it safely. At that moment I was honestly surprised because for me it was just a small casual thing. But you treated it like something valuable.",
    "23. At first I didn’t fully understand why. But later… I understood. Because when you gave me that flower, something similar happened to me too. I still have that flower. It has dried completely now yet I still don’t feel like throwing it away. Maybe because sometimes the value of things does not come from the object itself… It comes from the person connected to it.",
    "24. There is also something I want to say honestly. Sometimes I feel like you ignore or avoid me. Maybe I am wrong. Maybe it is just overthinking. But if I ever said or did anything that hurt you, then I am sincerely sorry. It was never my intention. You genuinely mattered to me and hurting you was never something I wanted.",
    "25. I still remember once when you explained Arithmetic Mean from Statistics to me using my rough register. Maybe for you it was just a normal study discussion but strangely that small moment stayed with me. And honestly… I still have your handwriting in that register.",
    "26. And now, it's your last days in college. It feels strange. Strange how time passed so quickly. Strange how people who were once strangers became memories. Strange how moments we thought were normal slowly became unforgettable.",
    "27. I don’t know what life will look like after this. Maybe we will stay in touch. Maybe conversations will slowly become less. Maybe one day we will only react to each other’s stories silently. Or maybe life will make us complete strangers again.",
    "28. But regardless of what happens in the future, I just wanted you to know this: These 4 months genuinely mattered to me. Your trust mattered to me. Your support mattered to me. Your presence mattered to me",
    "29. And somewhere in my college life memories, you will always have a very special place. Thank you for every conversation. Thank you for every moment. Thank you for every smile. Thank you for every little thing you did knowingly or unknowingly.",
    "30. You became one of the most beautiful and unexpected parts of my college life. And if one day life makes us strangers again I will still smile remembering that once in a short phase of life called college, I met someone truly special.",
    "31. May Allah always protect your smile, your soft heart, your peace and your happiness. Take care of yourself always. You will always be remembered.",
    "32. If I ever failed to express myself properly in words, then forgive me for that. Some feelings are too quiet to be explained perfectly, they only exist in sincerity. I never expected anything from you, not even a reply to this message. I just wanted to leave behind something honest before everything becomes distant and silent with time.",
    "33. Whatever life brings next for you, I genuinely hope it brings you peace in your heart, success in your exams and ease in every step you take after college. And if someday, years later, this message crosses your mind again… I just hope it reminds you that once upon a time, someone silently prayed for your happiness, without asking for anything in return.",
    "34. Goodbye, Sana… \nNot as an ending but as a quiet prayer for your beginning."
];

let openedCount = 0;
document.addEventListener("DOMContentLoaded", () => {
    const counter = document.getElementById("counter");

    let openedCount = 0;
    const openedSet = new Set();

    function updateCounter() {
        counter.innerText = `Opened: ${openedCount} / ${messages.length}`;
        counter.style.transform = "scale(1.15)";
        setTimeout(() => counter.style.transform = "scale(1)", 200);
    }

    window.__counterState = { openedSet, updateCounter, get openedCount() { return openedCount; } };

    window.__incrementCounter = function(index) {
        if (!window.__counterState.openedSet.has(index)) {
            window.__counterState.openedSet.add(index);
            openedCount++;
            window.__counterState.updateCounter();
        }
    };
});

/* Web Audio API Engine for UX Tones */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClickSound(freq, duration) {
    try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

let typeInterval = null;
let currentActiveEnvelope = null;

function openMessage(envelopeEl, index) {
    playClickSound(580, 0.15);

    if (currentActiveEnvelope) {
        currentActiveEnvelope.classList.remove('open');
    }
    currentActiveEnvelope = envelopeEl;
    currentActiveEnvelope.classList.add('open');

    const overlay = document.getElementById("msgOverlay");
    const span = document.getElementById("globalTypedText");
    const text = messages[index];

    overlay.classList.add("active");
    span.textContent = '';

    if (typeInterval) clearInterval(typeInterval);

    let i = 0;
    typeInterval = setInterval(() => {
        span.textContent += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(typeInterval);
    }, 18);

    window.__incrementCounter(index);
}

function closeMessage() {
    playClickSound(320, 0.1);
    document.getElementById("msgOverlay").classList.remove("active");
    if(typeInterval) clearInterval(typeInterval);
    
    if (currentActiveEnvelope) {
        currentActiveEnvelope.classList.remove('open');
        currentActiveEnvelope = null;
    }
}

/* Photo Book Galleries Arrays */
const imagesLeft = [
    "img/img1.jpeg","img/img2.jpeg","img/img3.jpeg","img/img4.jpeg","img/img5.jpg","img/img6.jpeg"
];

const bookLeft = document.getElementById("bookLeft");

imagesLeft.forEach(src => {
    const div = document.createElement("div");
    div.className = "page";
    div.style.backgroundImage = `url('${src}')`;
    bookLeft.appendChild(div);
});

const pagesLeft = document.querySelectorAll("#bookLeft .page");

let iLeft = 0;

function updateBooks() {
       pagesLeft.forEach((p, i) => {
        p.classList.remove("active","prev","next");
        if (i === iLeft) p.classList.add("active");
        else if (i < iLeft) p.classList.add("prev");
        else p.classList.add("next");
    });
}

setInterval(() => {
    if(pagesLeft.length) iLeft = (iLeft + 1) % pagesLeft.length;
    updateBooks();
}, 2500);

updateBooks();

function goBack(event) {
    if (event) event.stopPropagation();
    playClickSound(880, 0.2);
    setTimeout(() => { window.location.href = "first.html"; }, 150);
}

/* Mouse Spark Particle Splash Mechanics */
document.addEventListener("click", function(e) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if(e.target.closest('.message-box') || e.target.closest('.back-btn') || e.target.closest('.next-btn') || e.target.closest('.mute-btn')) return;

    for (let count = 0; count < 6; count++) {
        const spark = document.createElement("div");
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 40 + 20;
        
        spark.style.position = "absolute";
        spark.style.left = e.clientX + "px";
        spark.style.top = e.clientY + "px";
        spark.style.width = "6px";
        spark.style.height = "6px";
        spark.style.borderRadius = "50%";
        
        const colors = ["#ff4e8a", "#800000", "#ffbe0b", "#ffffff"];
        const chosenColor = colors[Math.floor(Math.random() * colors.length)];
        spark.style.background = chosenColor;
        spark.style.boxShadow = `0 0 10px ${chosenColor}`;
        spark.style.pointerEvents = "none";
        spark.style.transform = "translate(0, 0) scale(1)";
        spark.style.opacity = "1";
        spark.style.transition = "all 0.6s cubic-bezier(0.1, 0.8, 0.3, 1)";

        document.body.appendChild(spark);

        setTimeout(() => {
            const xMovement = Math.cos(angle) * speed;
            const yMovement = Math.sin(angle) * speed;
            spark.style.transform = `translate(${xMovement}px, ${yMovement}px) scale(0)`;
            spark.style.opacity = "0";
        }, 10);

        setTimeout(() => { spark.remove(); }, 650);
    }

    const bgMusic = document.getElementById('bgMusic');
    if (bgMusic && bgMusic.paused) {
        bgMusic.play().catch(err => console.log("Autoplay waiting for user gesture."));
    }
});

/* Background Floating Space Particles Engine */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function generateParticles() {
    particles = [];
    for (let i = 0; i < 45; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 1.5 + 0.5,
            alpha: Math.random() * 0.5 + 0.2,
            speedY: -(Math.random() * 0.4 + 0.1)
        });
    }
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    generateParticles(); // FIXED: Regnerates particle maps safely on window size alterations
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let p of particles) {
        p.y += p.speedY;
        if (p.y < 0) {
            p.y = canvas.height;
            p.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);

        const goldColors = [
    `rgba(255, 215, 0, ${p.alpha})`,   // gold
    `rgba(255, 223, 100, ${p.alpha})`, // light gold
    `rgba(255, 255, 255, ${p.alpha})`  // sparkle white
];

ctx.fillStyle = goldColors[Math.floor(Math.random() * goldColors.length)];

        ctx.fill();
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();

/* Media Audio Tracks Controller */
function toggleMute(event) {
    if (event) event.stopPropagation(); 
    const bgMusic = document.getElementById('bgMusic');
    const muteBtn = document.getElementById('muteBtn');
    
    if (bgMusic.muted) {
        bgMusic.muted = false;
        muteBtn.textContent = '🔊';
        muteBtn.style.color = '#800000';
        muteBtn.style.borderColor = 'rgba(0, 194, 255, 0.4)';
    } else {
        bgMusic.muted = true;
        muteBtn.textContent = '🔇';
        muteBtn.style.color = '#ff4e8a'; 
        muteBtn.style.borderColor = 'rgba(255, 78, 138, 0.4)';
    }
}
